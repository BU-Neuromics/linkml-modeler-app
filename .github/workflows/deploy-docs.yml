name: Deploy Docs + App

on:
  push:
    branches:
      - main
    paths:
      - 'packages/docs/**'
      - 'packages/web/**'
      - 'packages/core/**'
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm --filter @linkml-editor/core run build

      - name: Build VitePress docs
        run: pnpm --filter @linkml-editor/docs run build

      - name: Build web app
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/app/
        run: pnpm --filter @linkml-editor/web build

      - name: Embed web app at /app/ in docs site
        run: |
          mkdir -p packages/docs/.vitepress/dist/app
          cp -r packages/web/dist/. packages/docs/.vitepress/dist/app/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure base URL
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          echo "ORIGIN=https://${OWNER}.github.io" >> "$GITHUB_ENV"
          echo "BASE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"

      - name: Wait for CDN propagation
        run: sleep 30

      - name: Verify all routes return 200
        run: |
          FAILED=0
          check() {
            local url="$1"
            local status
            status=$(curl -sSL --max-time 30 --retry 3 --retry-delay 10 \
              -o /dev/null -w "%{http_code}" "$url")
            if [ "$status" = "200" ]; then
              printf 'OK    [%s] %s\n' "$status" "$url"
            else
              printf 'FAIL  [%s] %s\n' "$status" "$url"
              FAILED=1
            fi
          }
          check "${BASE_URL}/"
          check "${BASE_URL}/user-guide"
          check "${BASE_URL}/development"
          check "${BASE_URL}/design-spec"
          check "${BASE_URL}/app/"
          check "${BASE_URL}/logo.svg"
          check "${BASE_URL}/favicon.svg"
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Open a GitHub issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pages smoke test failed after deploy on $(date -u +%Y-%m-%d)" \
            --body "Post-deploy smoke test failed for commit \`$GITHUB_SHA\`. Check the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for details." \
            --label bug || true
