# Web deployment: nginx serving the Vite build + isomorphic-git CORS proxy.
#
# The web image is self-contained (multi-stage: pnpm build -> nginx), so no
# host-side build is required — this works from a clean checkout:
#
#   docker compose -f deploy/web/docker-compose.yml up --build
#
# To serve under a subpath (e.g. /linkml-editor/), set BASE_PATH (it feeds
# both the Vite asset base and the nginx location prefix — one value, they
# can't drift):
#
#   BASE_PATH=/linkml-editor/ \
#     docker compose -f deploy/web/docker-compose.yml up --build
#
# GIT_CORS_PROXY defaults to the same-origin /cors-proxy path served by the
# nginx reverse proxy below. Override with an absolute URL if the proxy runs
# elsewhere. GITHUB_CLIENT_ID (optional) enables the GitHub sign-in UI.

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile.web
      args:
        BASE_PATH: ${BASE_PATH:-/}
        GIT_CORS_PROXY: ${GIT_CORS_PROXY:-${BASE_PATH:-/}cors-proxy}
        GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    ports:
      - "80:80"
    depends_on:
      - proxy
    restart: unless-stopped

  proxy:
    build:
      context: ../../packages/proxy
    environment:
      - PORT=9999
      # Restrict to your app's domain in production, e.g.:
      # ALLOW_ORIGIN=https://your-domain.com
      - ALLOW_ORIGIN=*
    restart: unless-stopped
    # The proxy is intentionally not exposed on a host port — nginx reverse
    # proxies /cors-proxy/ to it so it's reachable on the same origin.
    # Uncomment to expose it directly for debugging:
    # ports:
    #   - "9999:9999"
